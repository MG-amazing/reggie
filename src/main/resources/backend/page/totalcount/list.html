<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- 引入样式 -->
    <link rel="stylesheet" href="../../plugins/element-ui/index.css"/>
    <link rel="stylesheet" href="../../styles/common.css"/>

    <link rel="stylesheet" href="../../styles/page.css"/>
    <style>
        .chart {
            width: 1400px;
            text-align: center;
            height: 300px;
            background: #fff;
            margin-bottom: 16px;
            border-radius: 8px;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        .dashboard-container {
            width: 100vw;
        }


        .search-btn {
            margin-left: 20px;
        }

        .tableBar {
            justify-content: flex-start !important;
        }

        .info-box {
            margin: -15px -44px 20px;
        }

        .info-box .item-box {
            display: flex;
            height: 20px;
            line-height: 20px;
            font-size: 14px;
            font-weight: 400;
            color: #666666;
            text-align: left;
            margin-bottom: 14px;
        }

        .info-box .item-box:last-child {
            margin-bottom: 0;
        }

        .info-box .item-box .label {
            width: 96px;
        }

        .info-box .item-box .des {
            flex: 1;
            color: #333333;
        }


    </style>
</head>
<body>
<div class="dashboard-container" id="order-app" v-loading="loading">
    <div class="btns">
        <el-button :type="range === 7 ? 'primary' : 'default'" @click="change(7)">7天</el-button>
        <el-button :type="range === 30 ? 'primary' : 'default'" @click="change(30)">30天</el-button>
        <el-button :type="range === 365 ? 'primary' : 'default'" @click="change(365)">1年</el-button>
    </div>

    <div id="lineChart" class="chart"></div>

    <div id="pieChart" class="chart"></div>

</div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

<script src="../../plugins/vue/vue.js"></script>
<script src="../../plugins/element-ui/index.js"></script>
<script src="../../plugins/axios/axios.min.js"></script>
<script src="../../js/request.js"></script>
<script src="../../api/count-total.js"></script>
<script>
    function formatDateTime(date) {
        const pad = n => String(n).padStart(2, '0')

        return (
            date.getFullYear() + '-' +
            pad(date.getMonth() + 1) + '-' +
            pad(date.getDate()) + ' ' +
            pad(date.getHours()) + ':' +
            pad(date.getMinutes()) + ':' +
            pad(date.getSeconds())
        )
    }

    function getDateRangeByDays(days) {
        const now = new Date()

        // 结束时间：今天 23:59:59
        const end = new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate(),
            23, 59, 59
        )

        // 起始时间：往前推 days-1 天的 00:00:00
        const start = new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate() - (days - 1),
            0, 0, 0
        )

        return [
            formatDateTime(start),
            formatDateTime(end)
        ]
    }

    new Vue({
        el: '#order-app',
        data() {
            return {
                loading: false,
                range: 7,
                lineData: [],
                pieData: [],
                lineChart: null,
                pieChart: null
            }
        },
        methods: {

            mockData(days) {
                let date = getDateRangeByDays(days)

                countTotalMealAndTotalAmountByDate({
                    dateBegin: date[0],
                    dateEnd: date[1]
                }).then(res => {
                    console.log(res)
                    this.lineData = res.data.data1 || []
                    this.pieData = res.data.data2 || []

                })
            }
            ,
            change(days) {
                this.range = days
                this.mockData(days)
            },
            renderLine() {
                this.lineChart.setOption({
                    grid: {
                        left: 30,
                        right: 20,
                        bottom: 30,
                        containLabel: true
                    },
                    xAxis: {
                        type: 'category',
                        data: this.lineData.map(i => i.day)
                    },
                    yAxis: {type: 'value'},
                    series: [{
                        type: 'line',
                        smooth: true,
                        data: this.lineData.map(i => i.value)
                    }]
                })
            },
            renderPie() {
                this.pieChart.setOption({
                    tooltip: {trigger: 'item'},
                    legend: {top: '5%', left: 'center'},
                    series: [{
                        type: 'pie',
                        radius: ['40%', '70%'],
                        padAngle: 5,
                        itemStyle: {borderRadius: 10},
                        label: {show: false},
                        emphasis: {
                            label: {
                                show: true,
                                fontSize: 28,
                                fontWeight: 'bold'
                            }
                        },
                        labelLine: {show: false},
                        data: this.pieData
                    }]
                })
            }
        },
        watch: {
            lineData() {
                this.renderLine()
            },
            pieData() {
                this.renderPie()
            }
        },
        mounted() {
            this.$nextTick(() => {
                const lineDom = document.getElementById('lineChart')
                const pieDom = document.getElementById('pieChart')

                this.lineChart = echarts.init(lineDom)
                this.pieChart = echarts.init(pieDom)

                this.mockData(this.range)

                setTimeout(() => {
                    this.lineChart.resize()
                    this.pieChart.resize()
                }, 0)
            })
        }

    })
</script>
</body>
</html>
